<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>Booking Success</title>
</head>

<body class="bg-white">
    <!-- Desktop/Tablet Navigation -->
    <nav class="bg-white hidden md:block">
        <div class="w-full mx-auto px-8 md:px-16">
            <div class="flex justify-between items-center py-6">
                <div class="flex items-center">
                    <div class="w-16 h-16 rounded-full bg-blue-600 hidden md:flex items-center justify-center">
                    </div>
                    <a href="index.html" class="text-black font-bold text-3xl px-2">Rent.</a>
                </div>

                <div class="flex items-center space-x-8 justify-center z-10 rounded-t-2xl py-3 px-3">
                    <a href="index.html"
                        class="py-4 px-2 text-gray-400 font-semibold hover:text-black transition duration-300">
                        <img class="m-auto hidden" src="assets/browse.png" alt="">
                        <p class="pt-1 hover:text-black text-gray-500">Browse</p>
                    </a>
                    <a href="#" class="py-4 px-2 text-black font-semibold transition duration-300">
                        <img class="m-auto hidden" src="assets/booking.png" alt="">
                        <p class="pt-1">Booking</p>
                    </a>
                    <a href="#" class="py-4 px-2 text-gray-400 font-semibold hover:text-black transition duration-300">
                        <img class="m-auto hidden" src="assets/promo.png" alt="">
                        <p class="pt-1 hover:text-black text-gray-500">Promo</p>
                    </a>
                    <a href="#" class="py-4 px-2 text-gray-400 font-semibold hover:text-black transition duration-300">
                        <img class="m-auto hidden" src="assets/help.png" alt="">
                        <p class="pt-1 hover:text-black text-gray-500">Help</p>
                    </a>
                </div>

                <div class="flex items-center">
                    <div>
                        <p class="text-black font-semibold">Your Location</p>
                        <p class="text-blue-600 font-semibold text-xl">Indonesia</p>
                    </div>
                    <div class="ml-2">
                        <img src="./assets/location-navbar.svg" alt="" class="w-16">
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container with Background -->
    <div class="bg-white min-h-screen">
        <nav class="bg-white p-4 w-full">
            <div class="flex items-center relative max-w-4xl mx-auto">
                <a href="booking.html"
                    class="flex items-center justify-center rounded-full bg-blue-100 p-3 absolute left-4 md:left-8">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-blue-600" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </a>

                <div class="flex flex-col items-center w-full md:items-start md:ml-16 lg:ml-24">
                    <span class="text-blue-600 text-sm">Start</span>
                    <h1 class="font-bold text-lg">Booking Car</h1>
                </div>
            </div>
        </nav>

        <!-- Success Content -->
        <div class="max-w-4xl mx-auto px-4 md:px-8 pt-8 pb-20">
            <!-- White Content Area -->
            <div class="bg-white rounded-2xl p-6 md:p-10 shadow-md mt-4 text-center">
                <h1 class="text-2xl md:text-3xl font-bold">Booking Is Finished,</h1>
                <h2 class="text-2xl md:text-3xl font-bold mb-6">Congratulation</h2>

                <!-- Car Image -->
                <div class="my-6 md:my-10">
                    <img src="./assets/car1.png" alt="Toyota Avanza" class="w-full max-w-xs mx-auto">
                </div>

                <!-- Transaction Details -->
                <p class="text-sm md:text-base mb-8 px-4 max-w-md mx-auto">
                    Gunakan booking id transaction berikut untuk memeriksa kendaraan yang sudah kamu booking.
                </p>

                <!-- Booking ID -->
                <div class="bg-white rounded-lg shadow-md p-6 text-center">
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Booking ID</label>
                        <input type="text" readonly
                            class="p-3 border border-gray-300 rounded-lg w-full text-center bg-gray-50 font-semibold"
                            value="">
                    </div>
                </div>

                <div class="mt-8 flex justify-between gap-4">
                    <a href="index.html"
                        class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 py-3 px-6 rounded-lg text-center font-medium">
                        Explore Again
                    </a>
                    <a href="listing-car.html"
                        class="w-full bg-black hover:bg-gray-800 text-white py-3 px-6 rounded-lg text-center font-medium">
                        Check My Booking
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script src="src/js/api.js"></script>
    <script src="src/js/bookingSuccess.js"></script>
</body>

</html>
