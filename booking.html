<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>Booking Car</title>
</head>

<body class="bg-white">
    <!-- Desktop/Tablet Navigation -->
    <nav class="bg-white hidden md:block">
        <div class="w-full mx-auto px-8 md:px-16">
            <div class="flex justify-between items-center py-6">
                <div class="flex items-center">
                    <div class="w-16 h-16 rounded-full bg-blue-600 hidden md:flex items-center justify-center">
                    </div>
                    <a href="#" class="text-black font-bold text-3xl px-2">Rent.</a>
                </div>

                <div class="flex items-center space-x-8 justify-center z-10 rounded-t-2xl py-3 px-3">
                    <a href="index.html" class="py-4 px-2 text-gray-400 font-semibold hover:text-black transition duration-300">
                        <img class="m-auto hidden" src="assets/browse.png" alt="">
                        <p class="pt-1 hover:text-black text-gray-500">Browse</p>
                    </a>
                    <a href="#" class="py-4 px-2 text-black font-semibold transition duration-300">
                        <img class="m-auto hidden" src="assets/booking.png" alt="">
                        <p class="pt-1">Booking</p>
                    </a>
                    <a href="#" class="py-4 px-2 text-gray-400 font-semibold hover:text-black transition duration-300">
                        <img class="m-auto hidden" src="assets/promo.png" alt="">
                        <p class="pt-1 hover:text-black text-gray-500">Promo</p>
                    </a>
                    <a href="#" class="py-4 px-2 text-gray-400 font-semibold hover:text-black transition duration-300">
                        <img class="m-auto hidden" src="assets/help.png" alt="">
                        <p class="pt-1 hover:text-black text-gray-500">Help</p>
                    </a>
                </div>

                <div class="flex items-center">
                    <div>
                        <p class="text-black font-semibold">Your Location</p>
                        <p class="text-blue-600 font-semibold text-xl">Indonesia</p>
                    </div>
                    <div class="ml-2">
                        <img src="./assets/location-navbar.svg" alt="" class="w-16">
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container with Background -->
    <div class="min-h-screen">
        <nav class="bg-white p-4 w-full">
            <div class="flex items-center relative max-w-4xl mx-auto">
                <a href="detail.html"
                    class="flex items-center justify-center rounded-full bg-blue-100 p-3 absolute left-4 md:left-8">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-blue-600" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </a>

                <div class="flex flex-col items-center w-full md:items-start md:ml-16 lg:ml-24">
                    <span class="text-blue-600 text-sm">Start</span>
                    <h1 class="font-bold text-lg">Booking Car</h1>
                </div>
            </div>
        </nav>

        <!-- Booking Content -->
        <div class="max-w-4xl mx-auto px-4 md:px-8 pt-6 pb-20">
            <!-- Car Card -->
            <!-- Car Card with responsive fixes -->
            <div
                class="bg-white rounded-2xl border border-gray-200 p-4 md:p-8 flex flex-col md:flex-row md:items-center md:justify-between mt-4 shadow-sm overflow-hidden">
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <img src="./assets/car1.png" alt="Toyota Avanza" class="w-24 md:w-52">
                        <div class="absolute top-0 left-0 bg-gray-200 rounded-md px-2 py-1 text-xs flex items-center">
                            3/5 <span class="ml-1"><img src="./assets/star.svg" alt="" class="w-3 h-3"></span>
                        </div>
                    </div>
                    <div>
                        <h2 class="font-bold text-sm md:text-xl">Toyota Avanza <span
                                class="text-xs md:text-sm font-medium">(Black)</span></h2>
                        <p class="font-bold text-blue-600 text-sm md:text-base">Rp 320,000 <span
                                class="text-gray-500 text-xs md:text-sm font-normal">/day</span></p>
                    </div>
                </div>
                <div class="flex items-center gap-4 mt-2 md:mt-0 justify-end">
                    <div class="flex items-center gap-1">
                        <img src="./assets/speed.svg" alt="" class="w-4 h-4 md:w-auto md:h-auto">
                        <span class="text-xs md:text-sm font-medium">250 kmh</span>
                    </div>
                    <div class="text-xs md:text-sm font-medium flex items-center">
                        <span>6</span>
                        <img src="./assets/seat.svg" alt="" class="w-4 h-4 md:w-auto md:h-auto ml-1">
                    </div>
                </div>
            </div>

            <!-- Form Title -->
            <h2 class="font-bold text-xl md:text-2xl mt-8 mb-4">Fill this form</h2>

            <!-- Booking Form -->
            <form class="space-y-4 md:max-w-full md:mx-auto">
                <div class="relative">
                    <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z"
                                clip-rule="evenodd" />
                        </svg>
                    </div>
                    <input type="text" placeholder="Booking Duration"
                        class="w-full p-4 pl-12 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="relative">
                    <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z"
                                clip-rule="evenodd" />
                        </svg>
                    </div>
                    <input type="date" placeholder="Booking Date"
                        class="w-full p-4 pl-12 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="relative">
                    <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
                                clip-rule="evenodd" />
                        </svg>
                    </div>
                    <input type="text" placeholder="Full Name"
                        class="w-full p-4 pl-12 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="relative">
                    <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
                        </svg>
                    </div>
                    <input type="email" placeholder="Email Address"
                        class="w-full p-4 pl-12 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="relative">
                    <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                            <path
                                d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z" />
                        </svg>
                    </div>
                    <input type="tel" placeholder="Phone Number"
                        class="w-full p-4 pl-12 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Submit button with proper cursor -->
                <a href="booking-succes.html" type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-full transition duration-300 flex items-center justify-center mt-6 cursor-pointer">
                    Continue Booking
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2" viewBox="0 0 20 20"
                        fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M12.293 5.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-2.293-2.293a1 1 0 010-1.414z"
                            clip-rule="evenodd" />
                    </svg>
                </a>
            </form>
        </div>
    </div>
</body>

</html>
